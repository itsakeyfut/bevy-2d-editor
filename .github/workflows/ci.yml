name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede a run on the same pull request, never on a push to main: what is on
# main is what the history claims about itself, and cancelling that leaves a
# commit nobody ever checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A failing test on a runner cannot be rerun under a debugger.
  RUST_BACKTRACE: 1

jobs:
  # `test` on every platform and every other check on Linux, each a job of its
  # own, so a failure reads on the Checks page as the check and the platform:
  # `test (windows-latest)`. docs/specs/dev-environment.md §3 says why only
  # `test` crosses the platforms, and why the checks are listed here at all.
  #
  # The legs are listed with `include` rather than crossed from two lists, so
  # that every step and the required check below stay one job's.
  #
  # Each leg carries the command it runs, flags and all, and this is the only
  # place the list of checks is written: there is no task runner, no local
  # gate script, and no test that reads this file. A flag dropped here, or a
  # crate a game is built from with no `game` leg, is caught by nobody;
  # docs/specs/dev-environment.md §3 records that.
  check:
    name: ${{ matrix.check }} (${{ matrix.os }})
    strategy:
      # Windows failing must not hide whether macOS passed. Knowing it is one
      # platform rather than all three is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - check: fmt
            os: ubuntu-latest
            run: cargo fmt --all -- --check
          # One leg per crate a game is built from, each checked as a game
          # resolves it, without the editor's features unified in.
          - check: game
            os: ubuntu-latest
            run: cargo check -p b2d_runtime --locked
          - check: clippy
            os: ubuntu-latest
            run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          # Linux only, so the assignment in front is bash's.
          - check: doc
            os: ubuntu-latest
            run: RUSTDOCFLAGS=-Dwarnings cargo doc --workspace --no-deps --document-private-items --locked
          - check: test
            os: ubuntu-latest
            run: cargo test --workspace --locked --no-fail-fast
          - check: test
            os: macos-latest
            run: cargo test --workspace --locked --no-fail-fast
          - check: test
            os: windows-latest
            run: cargo test --workspace --locked --no-fail-fast
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      # rust-toolchain.toml names the channel and the components, and
      # `rustup show` installs exactly what it names. No toolchain action, so
      # the pin in the repository stays the only place a version is written.
      - name: Install the toolchain named by rust-toolchain.toml
        run: rustup show
      # docs/specs/dev-environment.md §3 decided against a cache and
      # made the reversal conditional on the change that brings Bevy into the
      # workspace, which is this one. Before it, a cold build was seconds and a
      # pinned action to keep current cost more than it saved. After it, a cold
      # build of the engine alone measured 3m18s locally, on every leg of a
      # three-platform matrix, on every push.
      #
      # After `rustup show`, because the cache key includes the toolchain.
      #
      # Caches per platform rather than per check, which would come to more
      # than the repository's 10 GiB and evict at random. `game`, `clippy` and
      # `doc` all compile dependencies in check mode, so they share one, saved
      # by `clippy`, which compiles the most of it; they run on Linux only, so
      # that cache is Linux's alone. `test` builds and keeps its own on each
      # platform. `fmt` builds nothing and takes no cache.
      - uses: Swatinem/rust-cache@v2.9.2
        if: contains(fromJSON('["game", "clippy", "doc", "test"]'), matrix.check)
        with:
          shared-key: ${{ matrix.check == 'test' && 'test' || 'check' }}
          save-if: ${{ matrix.check == 'test' || matrix.check == 'clippy' }}
      # Linux only, and derived from Cargo.lock rather than copied: wayland-sys
      # probes wayland-client, wayland-cursor and wayland-egl through
      # pkg-config and unwraps, and libudev-sys does the same for libudev. Both
      # arrive with the engine, because bevy's `2d` feature pulls
      # `default_platform`, which names x11, wayland and bevy_gilrs. Everything
      # else Linux-facing in the lock is a `-dl` crate that opens its library at
      # run time and needs nothing here.
      #
      # No libasound2-dev: no alsa crate is in the lock, because the audio
      # feature is not taken. See docs/specs/ui.md §3.
      #
      # Leaving this out does not fail quietly. The Linux leg goes red on the
      # first build, which is why it carries no test of its own.
      - name: Install the libraries the engine links against on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwayland-dev libudev-dev
      - run: ${{ matrix.run }}

  # The one check name branch protection requires. It stays correct when the
  # matrix gains or loses a check or a platform, because `needs.check.result`
  # is one result over every leg, and it is what stops a leg that did not
  # succeed reading as a pass.
  #
  # The condition is a total one rather than a list of the results somebody
  # thought of. `needs.<job>.result` has four values, and enumerating three of
  # them is how a leg that is skipped, by a path filter added later or by an
  # `if:` on the job, turns the required check green over a commit nothing
  # ever built.
  ci:
    name: All platforms
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every leg succeeded
        if: needs.check.result != 'success'
        run: exit 1
