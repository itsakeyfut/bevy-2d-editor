name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede a run on the same pull request, never on a push to main: what is on
# main is what the history claims about itself, and cancelling that leaves a
# commit nobody ever checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A failing test on a runner cannot be rerun under a debugger.
  RUST_BACKTRACE: 1

jobs:
  # The whole gate, on every platform. docs/specs/dev-environment.md §3 says
  # why all three run all of it rather than the cheaper split.
  gate:
    name: Gate (${{ matrix.os }})
    strategy:
      # Windows failing must not hide whether macOS passed. Knowing it is one
      # platform rather than all three is most of the diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      # rust-toolchain.toml names the channel and the components, and
      # `rustup show` installs exactly what it names. No toolchain action, so
      # the pin in the repository stays the only place a version is written.
      - name: Install the toolchain named by rust-toolchain.toml
        run: rustup show
      # One command, because xtask is where the checks are defined. A row added
      # there runs here without this file being touched, which is the split
      # that putting the gate in the repository was for. A failed check names
      # itself as an annotation, so the Checks page says which one it was.
      - run: cargo xtask all

  # The one check name branch protection requires. It stays correct when the
  # matrix gains or loses a platform, and it is what makes a cancelled or
  # skipped leg count as a failure instead of reading as a pass.
  ci:
    name: All platforms
    if: always()
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any leg failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
