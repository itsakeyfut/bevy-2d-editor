name: Experiment
description: A question that has to be answered by trying it, because design alone could not settle it. Opened when spec finds a task is not yet implementable.
title: "spike: "
labels: ["T-Experiment"]
body:
  - type: markdown
    attributes:
      value: |
        Opened when `/spec` decides a task cannot be implemented yet and the
        reason is something only evidence can settle.

        Work happens on a throwaway branch and results are posted here as
        comments while they arrive, so that stopping halfway loses nothing. When
        there is an answer, it goes back to the parent issue as a comment, with
        the evidence, and that is what unblocks it.

        An experiment is allowed to fail. A failed experiment that is written
        down is worth more than an unwritten success, because the next person to
        have the same idea stops sooner.

        Some questions are already known to need this. `docs/specs/open-questions.md`
        lists the decisions held back on purpose, each with the condition that
        makes it answerable. If the question is one of those, say so: the
        trigger condition is half the experiment's design already.

  - type: input
    id: parent
    attributes:
      label: Blocks
      description: The issue this exists to unblock.
      placeholder: "#14"
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: The question
      description: >
        What is not known. One question, stated so that an answer is possible:
        "can X be done" rather than "investigate X".
      placeholder: |
        Can a 512x512 tile layer be painted through `TilemapChunk` at 60fps
        without per-chunk dirty tracking, or does a single tile edit force
        every chunk mesh to be rebuilt?
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: What would count as a good result
      description: >
        Decided **before** running anything. This is the whole difference
        between an experiment and a justification: written afterwards, the bar
        moves to wherever the result landed.
      placeholder: |
        A prototype that paints into a 512x512 layer with frame time under 16ms,
        where a trace shows at most one chunk mesh rebuilt per stroke. Anything
        that rebuilds every chunk, or drops below 60fps on the dev machine, is a
        negative result and settles the question the other way.
    validations:
      required: true

  - type: textarea
    id: method
    attributes:
      label: How it will be tried
      description: >
        A throwaway branch, a prototype, a measurement, a comparison against
        how Jackdaw or another Bevy project solved it. Say what is disposable:
        nothing here is expected to merge.
    validations:
      required: true

  - type: textarea
    id: giving_up
    attributes:
      label: When to stop
      description: >
        A bound, so that an open-ended experiment does not become the project.
        A number of attempts, a scope, or a condition under which the answer is
        "no" and the parent issue gets that as its evidence.
