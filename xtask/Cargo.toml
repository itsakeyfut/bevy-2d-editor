[package]
name = "xtask"
version.workspace = true
edition.workspace = true
# Nothing depends on this and nothing ever will: it is the workspace's own
# tooling. That is also why it carries no `b2d_` prefix, which
# docs/specs/crates.md §4 introduced to hold names on crates.io.
publish = false

[dependencies]
regex.workspace = true

# Only tests use these. `cargo metadata` prints JSON, and the workflow and the
# manifests are read through parsers rather than as text, for the reason
# RK-001 in .claude/review/knowledge.md gives: a comment defeated a text scrape
# three ways.
[dev-dependencies]
serde_json.workspace = true
toml.workspace = true
yaml-rust2.workspace = true

[lints]
workspace = true
