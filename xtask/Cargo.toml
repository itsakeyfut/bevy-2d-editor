[package]
name = "xtask"
version.workspace = true
edition.workspace = true
# Nothing depends on this and nothing ever will: it is the workspace's own
# tooling. That is also why it carries no `b2d_` prefix, which
# docs/specs/crates.md §4 introduced to hold names on crates.io.
publish = false

[dependencies]
regex.workspace = true

# Only the test that reads how the engine resolves uses this: `cargo metadata`
# prints JSON.
[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
