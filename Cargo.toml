[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# `b2d_editor` is deliberately absent: nothing in this workspace may depend on
# it. See docs/specs/crates.md §3 for the direction, and §4 for why the package
# names are not the directory names.
[workspace.dependencies]
b2d_core = { path = "crates/core" }
b2d_data = { path = "crates/data" }
b2d_runtime = { path = "crates/runtime" }
b2d_editor_ui = { path = "crates/editor_ui" }

# Every external dependency is declared here, once, with its version and its
# features, and a member names it as `<name>.workspace = true`. A version is
# then changed in one place, and two members cannot ask for two of them.

# The stack, and why the defaults are not taken, are settled in
# docs/specs/ui.md §3. What dropping them costs is bevy_audio and bevy_gltf and
# nothing this milestone needs; §3 carries the measurement, and a second copy
# of it here is a second copy to go stale. xtask's
# every_crate_that_takes_the_engine_gets_the_features_the_specification_settled
# holds this entry against that section.
bevy = { version = "0.20.1", default-features = false, features = [
    "2d",
    "ui",
    "bevy_feathers",
] }
regex = "1.13.1"
serde_json = "1.0.151"

[workspace.lints.rust]
# The gate runs clippy with `-D warnings`, so a crate that does not say what it
# is for fails the build rather than drifting.
missing_docs = "warn"

[workspace.lints.clippy]
doc_markdown = "warn"
semicolon_if_nothing_returned = "warn"
redundant_else = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
